# Gerado por: /quality-gates:check-security
name: Secret scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    name: Gitleaks

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -sSL -o "$asset" "$base_url/$asset"
          curl -sSL -o checksums.txt "$base_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          grep " $asset\$" checksums.txt | sha256sum -c -

          tar -xzf "$asset" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks (só nos commits deste PR)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose
